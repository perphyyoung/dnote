[package]
name = "dnote"
version = "0.1.0"
description = "minimal drag-reorderable notepad"
authors = ["py"]
license = "GPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
toml = "0.8"
chrono = "0.4"
log = "0.4"
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
# 笔记备份用的文件对话框（只在 Rust 侧用，故 capabilities 无需开 dialog 权限）
tauri-plugin-dialog = "2"
# 备份包（zip）：只开 deflate，不引入 aes/bzip2/zstd 等默认特性。
# **必须写等号 + 靠 Cargo.lock 锁住**：本机镜像的索引把 zip 的 2.x/4.x 全标成了 yanked
# （且没有更新的版本），只有「已锁定」的版本才允许继续用（4.6.1 与 paim 锁的是同一个）。
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "javascript", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
