[package]
name = "dnote"
version = "0.1.0"
description = "minimal drag-reorderable notepad"
authors = ["py"]
license = "GPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
toml = "0.8"
chrono = "0.4"
log = "0.4"
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "javascript", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
